<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EasyPago - Generar Cobro</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="tarjeta">
    <h2 style="color: #1a73e8; margin-top: 0;">Crear Cobro QR</h2>
    
    <input type="text" id="nombre" placeholder="Nombre completo (Ej: Juan Pérez)">
    <input type="text" id="rut" placeholder="RUT (Ej: 19.876.543-2)">
    <select id="banco">
        <option value="BancoEstado">BancoEstado</option>
        <option value="Banco de Chile">Banco de Chile</option>
        <option value="Santander">Santander</option>
        <option value="BCI">BCI</option>
    </select>
    <select id="tipoCuenta">
        <option value="Cuenta RUT">Cuenta RUT</option>
        <option value="Cuenta Corriente">Cuenta Corriente</option>
        <option value="Cuenta Vista">Cuenta Vista</option>
    </select>
    <input type="number" id="numeroCuenta" placeholder="N° de Cuenta">
    <input type="email" id="correo" placeholder="Correo electrónico">
    <input type="text" id="asunto" placeholder="Asunto (Ej: Pago cena)">

    <button onclick="generar()">Generar QR y Token</button>

    <div id="caja-resultado">
        <strong>¡Listo para cobrar!</strong>
        <img id="imagen-qr" src="" alt="QR">
        <p id="texto-token" style="word-break: break-all; font-family: monospace; font-size: 11px; background: white; padding: 5px; border-radius: 4px; border: 1px solid #ccc;"></p>
        
        <button id="btnCopiar" class="btn-copiar" onclick="copiarAlPortapapeles()" style="display: none;">
          📋 Copiar Token
        </button>

        <a href="pagar.html" id="btnIrAPagar" class="btn-pagar" style="display: none; height: 40px; border-radius: 6px; font-weight: bold; text-decoration: none;">
          💸 Ir a la Página de Pago
        </a>
    </div>
</div>

<script>
    async function generar() {
        const datos = {
            nombre: document.getElementById('nombre').value || "Sin Nombre",
            rut: document.getElementById('rut').value || "11.111.111-1",
            banco: document.getElementById('banco').value,
            tipoCuenta: document.getElementById('tipoCuenta').value,
            numeroCuenta: document.getElementById('numeroCuenta').value || "0",
            correo: document.getElementById('correo').value || "test@test.cl",
            asunto: document.getElementById('asunto').value || "Sin asunto"
        };

        try {
            const respuesta = await fetch('https://api-easypago.onrender.com/api/v1/generar-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            const resultado = await respuesta.json();

            if (respuesta.ok) {
                document.getElementById('caja-resultado').style.display = 'block';
                document.getElementById('texto-token').innerText = resultado.token;
                
                const imgQr = document.getElementById('imagen-qr');
                imgQr.src = resultado.qr_imagen;
                imgQr.style.display = 'block';

                // Mostrar ambos botones al tener éxito
                document.getElementById('btnCopiar').style.display = 'block';
                document.getElementById('btnIrAPagar').style.display = 'flex';
            } else {
                alert("Error desde Python: " + JSON.stringify(resultado));
            }
        } catch (error) {
            alert("Error de conexión con Python.");
        }
    }

    function copiarAlPortapapeles() {
        const textoToken = document.getElementById('texto-token').innerText; 
        navigator.clipboard.writeText(textoToken).then(() => {
            const btn = document.getElementById('btnCopiar');
            const textoOriginal = ' Copiar Token';
            btn.innerHTML = ' ¡Copiado!';
            setTimeout(() => {
                btn.innerHTML = textoOriginal;
            }, 2000);
        }).catch(err => {
            alert('No se pudo copiar el texto.');
        });
    }
</script>

</body>
</html>
