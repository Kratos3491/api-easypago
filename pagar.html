<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EasyPago - Nueva Transferencia</title>
    <link rel="stylesheet" href="pagar.css">
</head>
<body>

<div class="tarjeta">
    <h2>Hacer Transferencia</h2>
    <p class="instruccion">Pega el código que te enviaron para autocompletar.</p>
    
    <div class="grupo-input">
        <input type="text" id="token-input" class="input-token" placeholder="Pegar código aquí...">
    </div>
    
    <button class="btn-magico" onclick="procesarToken()"> Autocompletar Información Bancaria</button>

    <hr>

    <div id="formulario-oculto">
        <div class="grupo-input">
            <label>Nombre Destinatario</label>
            <input type="text" id="res-nombre" class="input-bloqueado" readonly placeholder="...">
        </div>

        <div class="grupo-input">
            <label>RUT Destinatario</label>
            <input type="text" id="res-rut" class="input-bloqueado" readonly placeholder="...">
        </div>
        <div class="grupo-input">
            <label>Banco</label>
            <input type="text" id="res-banco" class="input-bloqueado" readonly placeholder="...">
        </div>
        <div class="grupo-input">
            <label>Tipo de Cuenta</label>
            <input type="text" id="res-tipo" class="input-bloqueado" readonly placeholder="...">
        </div>
        <div class="grupo-input">
            <label>N° de Cuenta</label>
            <input type="text" id="res-numero" class="input-bloqueado" readonly placeholder="...">
        </div>
        <div class="grupo-input">
            <label>Correo Electrónico</label>
            <input type="text" id="res-correo" class="input-bloqueado" readonly placeholder="...">
        </div>
        <div class="grupo-input">
            <label>Asunto</label>
            <input type="text" id="res-asunto" class="input-bloqueado" readonly placeholder="...">
        </div>
    </div>

    <button id="btn-final" class="btn-transferir" onclick="alert('¡Simulación de transferencia exitosa!')">Confirmar Transferencia</button>
</div>

<script>
    async function procesarToken() {
        const tokenPegado = document.getElementById('token-input').value.trim();

        if (!tokenPegado) {
            alert("Por favor, pega el código primero.");
            return;
        }

        try {
            const respuesta = await fetch('https://api-easypago.onrender.com/api/v1/interpretar-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: tokenPegado })
            });

            const datos_bancarios = await respuesta.json();

            if (respuesta.ok) {
                document.getElementById('res-nombre').value = datos_bancarios.nombre;
                document.getElementById('res-rut').value = datos_bancarios.rut;
                document.getElementById('res-banco').value = datos_bancarios.banco;
                document.getElementById('res-tipo').value = datos_bancarios.tipoCuenta;
                document.getElementById('res-numero').value = datos_bancarios.numeroCuenta;
                document.getElementById('res-correo').value = datos_bancarios.correo;
                document.getElementById('res-asunto').value = datos_bancarios.asunto;

                document.getElementById('formulario-oculto').style.opacity = '1';
                document.getElementById('btn-final').style.display = 'block';
                
            } else {
                alert("Código inválido: " + datos_bancarios.detail);
            }
        } catch (error) {
            alert("Error conectando con el servidor.");
        }
    }
</script>

</body>
</html>
